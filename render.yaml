services:
  - type: web
    name: dawwara
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/me
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dawwara-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: dawwara-db
    plan: free
    region: frankfurt
